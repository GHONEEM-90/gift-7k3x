<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إلى أمنية ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--rose:#f4b6c2;--red:#e05a73;--deep:#a8324e;--ink:#5a2a3a}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:'Tajawal',Tahoma,sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffe3ea,#fff 45%,#ffd9e2) fixed;overflow-x:hidden}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.h{position:absolute;bottom:-50px;opacity:0;animation:up linear forwards}
@keyframes up{0%{transform:translate(0,0) scale(.6);opacity:0}12%{opacity:.65}100%{transform:translate(var(--x),-115vh) scale(1.1) rotate(25deg);opacity:0}}
.screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;padding:24px;text-align:center;transition:opacity .8s}
.screen.out{opacity:0}
#t1{font-family:'Aref Ruqaa',serif;font-size:clamp(1.7rem,7vw,2.6rem);line-height:2;color:var(--deep)}
.fade{opacity:0;animation:in 1.8s ease forwards}
#t1{animation-delay:.5s}#t2{font-size:1.15rem;line-height:1.9;animation-delay:2s}#open{animation-delay:3.6s}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.btn{font:500 1.1rem 'Tajawal',sans-serif;color:#fff;border:0;border-radius:50px;padding:15px 34px;cursor:pointer;background:linear-gradient(135deg,#ee8aa0,var(--red));box-shadow:0 8px 24px rgba(224,90,115,.35);transition:transform .3s}
.btn:active{transform:scale(.96)}
#open{animation:in 1.8s 2.4s ease forwards,pulse 2.6s 5.6s infinite}
@keyframes pulse{50%{box-shadow:0 8px 34px rgba(224,90,115,.6);transform:scale(1.04)}}
#letter{position:relative;z-index:1;padding:80px 16px 90px;opacity:0;transition:opacity 1.2s}
#letter.on{opacity:1}
.card{max-width:560px;margin:0 auto;padding:34px 24px;border-radius:28px;background:rgba(255,255,255,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(244,182,194,.55);box-shadow:0 12px 40px rgba(224,90,115,.15)}
.rv{opacity:0;transform:translateY(26px);transition:opacity 1.3s ease,transform 1.3s ease}
.rv.show{opacity:1;transform:none}
.card p{font-size:1.12rem;line-height:2.15;margin-bottom:1.5rem}
.card p.lead{font-family:'Aref Ruqaa',serif;font-size:1.4rem;color:var(--deep);text-align:center;line-height:2.1}
.dv{text-align:center;color:var(--rose);font-size:1.3rem;margin:.4rem 0 1.6rem;letter-spacing:.6rem}
.card p.quote{font-family:'Aref Ruqaa',serif;font-size:1.85rem;line-height:2;color:var(--red);text-align:center;margin:2.6rem 0 1.6rem}
.card p.fin{text-align:center;font-size:1.2rem;line-height:2.1;color:var(--deep)}
.sig{text-align:center;font-family:'Aref Ruqaa',serif;font-size:1.5rem;color:var(--deep);line-height:1.9;margin-bottom:2rem}
#end{text-align:center}
a.btn{display:block;width:max-content;max-width:100%;margin:0 auto 1.2rem;text-decoration:none}
#song[hidden]{display:none}
#music{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:5;font:500 .85rem 'Tajawal',sans-serif;color:var(--deep);background:rgba(255,255,255,.85);border:1px solid var(--rose);border-radius:30px;padding:9px 15px;cursor:pointer;box-shadow:0 4px 14px rgba(224,90,115,.2)}
</style>
</head>
<body>
<div id="hearts"></div>

<section id="intro" class="screen">
  <p id="t1" class="fade">إلى <span class="nm"></span>...<br>أجمل صدفة وأحلى حاجة حصلت في حياتي ❤️</p>
  <p id="t2" class="fade">في رسالة صغيرة... بس جواها كلام كتير من قلبي ليكي</p>
  <button id="open" class="btn fade">افتحي رسالتك يا <span class="nm"></span></button>
</section>

<main id="letter" hidden>
  <article class="card">
    <div id="paras"></div>
    <section id="end">
      <p class="quote rv" id="q">ولو رجع بيا الزمن ألف مرة،<br>هختارك إنتِ في كل مرة ❤️</p>
      <p class="fin rv">بحبك يا <span class="nm"></span>.. ويا رب أفضل دايمًا سبب في ضحكتك، وأفضل الشخص اللي قلبك يطمن معاه. ❤️</p>
      <div class="sig rv">من قلبي ليكي، للأبد<br><span class="from"></span></div>
      <a id="song" class="btn rv" target="_blank" rel="noopener" hidden>🎵 اسمعي أغنيتنا «معايا»</a>
      <button id="again" class="btn rv">اقري الرسالة تاني ❤️</button>
    </section>
  </article>
</main>

<button id="music">🎵 شغّلي الموسيقى</button>

<script>
/* ====== غيّر الاسمين هنا بس ====== */
const NAME = 'أمنية';    // اسم حبيبتك
const FROM = 'محمد';     // اسمك اللي هيظهر في الإمضاء
const SONG_URL = '';     // (اختياري) لينك أغنية معايا على يوتيوب أو أنغامي، وهيظهر زرار في آخر الصفحة
/* ================================= */

const LETTER = [
 'أمنية، يمكن الهدية اللي في إيدك صغيرة، ويمكن الكلام اللي هتقريه مش هيقدر يوصف كل اللي جوايا، بس أنا حبيت أعملك حاجة تفضلك ذكرى، وكل ما تشوفيها تفتكري إن فيه حد بيحبك وبيشوفك أجمل حاجة في دنيته.',
 'عارفة يا {n}، في ناس بتدخل الحياة فتغيّر شكلها من غير ما حد يحس. وإنتِ كده بالظبط. من ساعة ما بقيتي في حياتي والأيام بقت أهدى وأخف وليها طعم. حتى التعب بقيت أستحمله أسهل، لما أفتكر إن في حد مستنيني أكلمه.',
 'أول حاجة عايز أقولها ليكي: شكرًا. شكرًا على اهتمامك بالتفاصيل الصغيرة اللي ناس كتير مبتاخدش بالها منها. شكرًا على سؤالك عليا، وعلى حنيتك، وعلى إنك بتسمعيني من غير ما تحسسيني إني تقيل.',
 'إنتِ عندك حنية غريبة. بتحسسي اللي قدامك إنه مهم وإن كلامه ليه قيمة. وأنا لما بتكلم معاكي مبحتاجش أمثّل ولا أبقى حد غير نفسي، وده أغلى إحساس ممكن حد يدّيه لحد.',
 '#',
 'وبحب دلعك يا أمنية. بحب لما تزعلي وتقولي «مفيش»، وأنا عارف إن وراها كلام كتير، وبحاول أصالحك بأي طريقة لحد ما الضحكة ترجع. حتى زعلك عندي له حلاوة، لأنه بيفكرني إني فارق معاكي.',
 'وبفتخر بيكي. بفتخر بجدعنتك، وبطيبة قلبك، وبطريقتك في الحياة. وكل ما أشوفك بتعدّي موقف صعب وتفضلي واقفة، بقول في سري: ربنا كرمني قوي بيكي.',
 'مش هوعدك إن كل أيامنا هتبقى حلوة، لأن ده مش حقيقي. بس هوعدك إني مش هسيب إيدك في الأيام الوحشة قبل الحلوة، وإني هحاول أتعلم وأكبر عشانك، وأبقى أحسن كل يوم من اللي قبله.',
 '#',
 'نفسي ييجي يوم نبص فيه على اللي إحنا فيه دلوقتي ونضحك، ونقول: شفتي عدّينا إزاي؟ نفسي نبني حاجة حلوة سوا، بيت دافي مليان ضحك وطمأنينة، وأحلام صغيرة نحققها واحدة ورا التانية.',
 'ولو يوم حسّيتي إن الدنيا تقيلة عليكي، افتكري إن فيه حد في ضهرك، مش بيحاسبك ولا بيحكم عليكي، بس بيحبك بجد، ومستعد يسمعك ويقعد جنبك لحد ما تهدي.',
 'أنا مش بحبك لأنك مثالية، أنا بحبك لأنك إنتِ. بعيوبك قبل مميزاتك، وبعنادك قبل هدوئك، وبكل تفصيلة فيكي حتى اللي إنتِ نفسك مش شايفاها.',
 'وعلى فكرة، اسمك مش صدفة. أمنية… وإنتِ فعلًا الأمنية اللي ربنا حققها لي من غير ما أعرف إني كنت محتاجها.'
];

const $ = s => document.querySelector(s);
const box = $('#paras');
LETTER.forEach((t, i) => {
  let el;
  if (t === '#') { el = document.createElement('div'); el.className = 'dv rv'; el.textContent = '❤ ❤ ❤'; }
  else { el = document.createElement('p'); el.className = 'rv' + (i === 0 ? ' lead' : ''); el.textContent = t.replace(/\{n\}/g, NAME); }
  box.appendChild(el);
});
$('.from').textContent = FROM;
document.querySelectorAll('.nm').forEach(e => e.textContent = NAME);
if (SONG_URL) { const a = $('#song'); a.href = SONG_URL; a.hidden = false; }

/* قلوب متحركة */
const hearts = $('#hearts'), icons = ['❤','♥','💗','💕'];
function heart(fast) {
  const h = document.createElement('span');
  h.className = 'h'; h.textContent = icons[Math.random() * icons.length | 0];
  const d = fast ? 3 + Math.random() * 3 : 9 + Math.random() * 7;
  h.style.cssText = `left:${Math.random() * 96}%;font-size:${12 + Math.random() * 22}px;color:${Math.random() > .5 ? '#f4a3b5' : '#e8788f'};animation-duration:${d}s;--x:${(Math.random() - .5) * 90}px`;
  hearts.appendChild(h); setTimeout(() => h.remove(), d * 1000);
}
setInterval(() => heart(false), 900);
for (let i = 0; i < 6; i++) setTimeout(() => heart(false), i * 300);
const burst = () => { for (let i = 0; i < 26; i++) setTimeout(() => heart(true), i * 70); };

/* ظهور تدريجي */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('show'); if (e.target.id === 'q') burst(); }
}), { threshold: .3 });
document.querySelectorAll('.rv').forEach(el => io.observe(el));

/* فتح الرسالة */
$('#open').onclick = () => {
  burst(); $('#intro').classList.add('out');
  setTimeout(() => {
    $('#intro').hidden = true; $('#letter').hidden = false;
    window.scrollTo(0, 0); requestAnimationFrame(() => $('#letter').classList.add('on'));
  }, 800);
};

/* إعادة القراءة */
$('#again').onclick = () => {
  document.querySelectorAll('.rv').forEach(el => el.classList.remove('show'));
  window.scrollTo({ top: 0, behavior: 'instant' }); burst();
};

/* الموسيقى: لو حطيت ملف music.mp3 جنب الصفحة هيشتغل، ولو مفيش هتشتغل نغمة هادية مدمجة */
const mp3 = new Audio('music.mp3'); mp3.loop = true; mp3.volume = .6;
const mb = $('#music'); let on = false, ctx, timer;
const N = [220,261.63,329.63,392, 174.61,220,261.63,349.23, 261.63,329.63,392,523.25, 196,246.94,293.66,392];
function tone(f, t, d, v) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + d);
}
function synth() {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume();
  let i = 0; clearInterval(timer);
  timer = setInterval(() => {
    const t = ctx.currentTime;
    tone(N[i % 16], t, 2.4, .11);
    if (i % 4 === 0) tone(N[i % 16] / 2, t, 3.4, .09);
    i++;
  }, 650);
}
mb.onclick = async () => {
  if (!on) { try { await mp3.play(); } catch (e) { synth(); } on = true; mb.textContent = '⏸ إيقاف الموسيقى'; }
  else { mp3.pause(); clearInterval(timer); on = false; mb.textContent = '🎵 شغّلي الموسيقى'; }
};
</script>
</body>
</html>
